# ==============================================================================
# CoinTrack - Industry Standard Docker Compose Configuration
# Complete Multi-Container Stack (MongoDB + Spring Boot Backend + Next.js Frontend)
# Environment variables are cleanly loaded from '.env' file
# ==============================================================================

name: cointrack

services:
  # ----------------------------------------------------------------------------
  # 1. DATABASE SERVICE - MongoDB 7.0
  # ----------------------------------------------------------------------------
  mongodb:
    image: mongo:7.0-noble
    container_name: cointrack-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD}
      MONGO_INITDB_DATABASE: ${MONGO_DATABASE}
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    networks:
      - cointrack-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.runCommand('ping').ok", "--quiet"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # ----------------------------------------------------------------------------
  # 2. BACKEND SERVICE - Spring Boot Java 21 REST API
  # ----------------------------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cointrack-backend
    restart: unless-stopped
    depends_on:
      mongodb:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE}
      PORT: ${PORT}
      MONGODB_URI: ${MONGODB_URI}
      MONGODB_DB: ${MONGODB_DB}
      JWT_SECRET: ${JWT_SECRET}
      ENCRYPTION_SECRET_KEY: ${ENCRYPTION_SECRET_KEY}
      TOTP_ENCRYPTION_KEY: ${TOTP_ENCRYPTION_KEY}
      EMAIL_MAGIC_LINK_SECRET: ${EMAIL_MAGIC_LINK_SECRET}
      FRONTEND_URL: ${FRONTEND_URL}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      EMAIL_BASE_URL: ${EMAIL_BASE_URL}
      EMAIL_API_BASE_URL: ${EMAIL_API_BASE_URL}
      BREVO_API_KEY: ${BREVO_API_KEY}
      BREVO_SENDER_EMAIL: ${BREVO_SENDER_EMAIL}
      BREVO_SENDER_NAME: ${BREVO_SENDER_NAME}
      EMAIL_SUPPORT: ${EMAIL_SUPPORT}
      GOLDAPI_KEY: ${GOLDAPI_KEY}
      GOLD_API_KEY: ${GOLD_API_KEY}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI}
    ports:
      - "${PORT:-8080}:8080"
    networks:
      - cointrack-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 40s

  # ----------------------------------------------------------------------------
  # 3. FRONTEND SERVICE - Next.js 16 Web Application
  # ----------------------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_BASE: ${NEXT_PUBLIC_API_BASE}
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL}
        NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${NEXT_PUBLIC_GOOGLE_CLIENT_ID}
        NEXT_PUBLIC_APP_NAME: ${NEXT_PUBLIC_APP_NAME}
        NEXT_PUBLIC_APP_VERSION: ${NEXT_PUBLIC_APP_VERSION}
        NEXT_PUBLIC_ENABLE_WEBSOCKETS: ${NEXT_PUBLIC_ENABLE_WEBSOCKETS}
        NEXT_PUBLIC_ENABLE_NOTIFICATIONS: ${NEXT_PUBLIC_ENABLE_NOTIFICATIONS}
        NEXT_PUBLIC_DEBUG: ${NEXT_PUBLIC_DEBUG}
    container_name: cointrack-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      NEXT_PUBLIC_API_BASE: ${NEXT_PUBLIC_API_BASE}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL}
      IFSC_API_KEY: ${IFSC_API_KEY}
    ports:
      - "3000:3000"
    networks:
      - cointrack-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s

# ------------------------------------------------------------------------------
# VOLUMES & NETWORKS DEFINITIONS
# ------------------------------------------------------------------------------
volumes:
  mongo-data:
    driver: local

networks:
  cointrack-network:
    driver: bridge
