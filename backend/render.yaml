# ==========================================
# Render.com Blueprint Configuration
# https://render.com/docs/blueprint-spec
# ==========================================

services:
  # Backend API Service
  - type: web
    name: cointrack-backend
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    # Region: singapore is the closest Render region to MongoDB Atlas AP_SOUTH_1
    # (Mumbai). The earlier `oregon` value caused cross-continent DB↔API latency.
    region: singapore
    plan: free      # or starter, standard, etc.

    # Health check configuration
    healthCheckPath: /actuator/health

    # Environment variables (set these in Render dashboard or use envVarGroups)
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: MONGODB_URI
        sync: false  # Set in dashboard - sensitive
      - key: MONGODB_DB
        value: Finance
      - key: JWT_SECRET
        sync: false  # Set in dashboard - sensitive
      - key: ENCRYPTION_SECRET_KEY
        sync: false  # Set in dashboard - AES-256 key (exactly 32 chars)
      - key: TOTP_ENCRYPTION_KEY
        sync: false  # Set in dashboard - 64 hex chars
      - key: EMAIL_MAGIC_LINK_SECRET
        sync: false  # Set in dashboard - JWT secret for email magic links
      - key: BREVO_API_KEY
        sync: false  # Set in dashboard - Brevo transactional email
      - key: GOLDAPI_KEY
        sync: false  # Set in dashboard - GoldAPI.io metal price provider
      - key: GOLDAPI_MONTHLY_LIMIT
        value: "100"
      - key: GOLDAPI_SAFETY_BUFFER
        value: "5"
      - key: FRONTEND_URL
        value: http://localhost:3000, https://cointrack-finance.vercel.app
      - key: EMAIL_BASE_URL
        value: http://localhost:3000, https://cointrack-finance.vercel.app
      - key: EMAIL_API_BASE_URL
        value: http://localhost:8080, https://cointrack-backend-1g44.onrender.com
      - key: CORS_ALLOWED_ORIGINS
        value: http://localhost:3000, http://127.0.0.1:3000, https://cointrack-finance.vercel.app, https://cointrack-backend-1g44.onrender.com
      - key: GOOGLE_CLIENT_ID
        sync: false  # Set in dashboard - Google OAuth client ID
      - key: GOOGLE_CLIENT_SECRET
        sync: false  # Set in dashboard - Google OAuth client secret
      - key: GOOGLE_REDIRECT_URI
        value: https://cointrack-finance.vercel.app/login  # Must match Google Cloud Console

    # Build settings
    buildCommand: ""  # Dockerfile handles build
    startCommand: ""  # Dockerfile handles start

    # Auto-deploy on push to main
    autoDeploy: true
    branch: main
